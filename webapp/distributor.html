<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پخش — کمپین زنجان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🚚 پخش</h1>
    <div class="row" style="align-items:center">
      <span class="who" id="who"></span>
      <button class="btn secondary" id="logout-btn">خروج</button>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="fulfillments" class="active">تحویل سفارش</button>
    <button data-tab="checkups">سرکشی هفتگی</button>
  </nav>

  <main>
    <section class="tab-panel active" id="panel-fulfillments">
      <p class="meta">مغازه‌هایی که ویزیتور سفارششون رو بسته و منتظر تحویل و وصول پول‌ان.</p>
      <div class="map" id="fulfill-map"></div>
      <div id="fulfill-list"></div>
    </section>

    <section class="tab-panel" id="panel-checkups">
      <p class="meta">سرکشی هفتگی مشتری‌های دائمی که امروز نوبتشونه.</p>
      <div id="checkup-list"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/jalali.js"></script>
  <script src="js/map.js"></script>
  <script src="js/distributor.js"></script>
</body>
</html>
